framework:
    rate_limiter:
        onboarding_account:
            policy: 'fixed_window'
            limit: 5
            interval: '1 hour'
            lock_factory: null
        onboarding_resend:
            policy: 'fixed_window'
            limit: 3
            interval: '1 hour'
            lock_factory: null

when@test:
    framework:
        rate_limiter:
            onboarding_account:
                policy: 'no_limit'
            onboarding_resend:
                policy: 'no_limit'
