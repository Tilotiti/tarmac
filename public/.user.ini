upload_max_filesize=10M
; Anomaly reports accept several unresized phone photos at once, so the total
; request payload has to be well above the per-file limit.
post_max_size=60M
; CVE-2026-109618 / CVE-2026-109619 (PHP2Shell, 21/10/2026): early analysis
; points at session upload progress. Nothing here uses it, so it stays off
; after the PHP fix too.
session.upload_progress.enabled = 0
session.use_strict_mode = 1
